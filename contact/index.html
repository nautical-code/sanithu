<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    
    <link rel="icon" id="favico" href="https://www.kali.org/images/favicon-dark.png"> 
    <link rel="icon" id="favico" href="https://www.kali.org/images/favicon-dark.png"> 
    <link href="https://fonts.googleapis.com/css?family=Offside" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    
    <style>
        body {
            background-color: #0c0c0c; 
            color: #fff; 
            font-family: Offside;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            margin-bottom: 20px;
        }
        /* Apply flexbox to the contact-buttons div */
        .contact-buttons {
            display: flex;
            flex-direction: row; /* Make the buttons stack vertically */
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .contact-button {
            background-color: #333; 
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .contact-button:hover {
            background-color: #555; 
        }
        .contact-icon {
            margin-right: 5px;
        }
        a {
         color: rgb(64, 255, 0);
        }
        a:hover {
         color: rgb(255, 204, 0);
        }
        
        /* Media query to adjust styles for screens less than 768px wide */
        @media only screen and (max-width: 768px) {
            .contact-buttons {
                flex-direction: column; /* Make the buttons horizontal on small screens */
            }
        }
    </style>
</head>
<body>
   <header>
    <h1>Contact Me</h1>

    <div class="contact-buttons">
        <a href="https://wa.me/+94760203709" target="_blank" class="contact-button">
            <i class="fab fa-whatsapp contact-icon"></i> WhatsApp
        </a>
        <a href="https://www.instagram.com/sanithu.aspx" target="_blank" class="contact-button">
            <i class="fab fa-instagram contact-icon"></i> Instagram
        </a>
        <a href="https://github.com/nautical-code" target="_blank" class="contact-button">
            <i class="fab fa-github contact-icon"></i> GitHub
        </a>
        <a href="https://t.me/+94760203709" target="_blank" class="contact-button">
            <i class="fab fa-telegram contact-icon"></i> Telegram
        </a>
        <a href="https://discordapp.com" target="_blank" class="contact-button">
            <i class="fab fa-discord contact-icon"></i> Discord
        </a>
        <a href="mailto:5upcr9hry@mozmail.com" class="contact-button">
            <i class="fas fa-envelope contact-icon"></i> Email
        </a>
        <a href="tel:0785252403" class="contact-button">
            <i class="fas fa-phone contact-icon"></i> Call
        </a>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</body>
</html>
